<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Docker 開発環境管理</title><link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/compose.css" /></head>
  <body>
    <header><div><p class="eyebrow">LOCAL DOCKER ENGINE</p><h1>開発環境管理</h1></div><div class="header-actions"><span id="identity" class="identity"></span><button id="logout" class="secondary">ログアウト</button><button id="refresh" class="secondary">更新</button></div></header>
    <main>
      <section id="connection" class="connection loading">Docker Engine に接続を確認しています…</section>
      <section class="metrics"><article><span>起動中</span><strong id="running">—</strong><small>コンテナ</small></article><article><span>停止中</span><strong id="stopped">—</strong><small>コンテナ</small></article></section>
      <section><div class="section-title"><div><p class="eyebrow">CONTAINERS</p><h2>コンテナ一覧</h2></div><select id="state-filter"><option value="all">すべての状態</option><option value="running">起動中</option><option value="exited">停止中</option><option value="paused">一時停止</option></select></div><div class="table-wrap"><table><thead><tr><th>名前</th><th>イメージ</th><th>状態</th><th>公開ポート</th><th>操作</th></tr></thead><tbody id="containers"><tr><td colspan="5">読み込み中…</td></tr></tbody></table></div></section>
      <section><div class="section-title"><div><p class="eyebrow">DOCKER COMPOSE</p><h2>Composeプロジェクト</h2></div></div><div id="compose-projects" class="compose-projects">読み込み中…</div></section>
      <section><div class="section-title"><div><p class="eyebrow">ACTIVITY</p><h2>操作履歴</h2></div></div><div id="history" class="history">履歴を読み込み中…</div></section>
      <section id="admin" hidden><div class="section-title"><div><p class="eyebrow">ADMINISTRATION</p><h2>利用者・監査</h2></div></div><div class="admin-grid"><form id="user-form" class="admin-card"><h3>利用者を追加・更新</h3><input name="subject" placeholder="OIDC subject" required /><input name="name" placeholder="表示名（任意）" /><input name="email" placeholder="メールアドレス（任意）" /><select name="role"><option value="viewer">閲覧者</option><option value="operator">操作者</option><option value="admin">管理者</option></select><button>保存</button></form><form id="host-form" class="admin-card"><h3>共有ホスト</h3><input name="displayName" id="host-name" required /><button>表示名を保存</button></form></div><div class="table-wrap"><table><thead><tr><th>subject</th><th>表示名</th><th>ロール</th><th></th></tr></thead><tbody id="users"></tbody></table></div><form id="audit-filter" class="audit-filter"><input name="subject" placeholder="利用者subject" /><input name="target" placeholder="対象" /><select name="outcome"><option value="">すべての結果</option><option value="success">成功</option><option value="failed">失敗</option><option value="partial">一部失敗</option></select><input name="from" type="datetime-local" /><input name="to" type="datetime-local" /><button>監査を検索</button></form><div id="audit" class="history"></div><div class="pager"><button id="audit-prev" class="secondary">前へ</button><span id="audit-page"></span><button id="audit-next" class="secondary">次へ</button></div></section>
    </main>
    <dialog id="details"><button class="close" aria-label="閉じる">×</button><div id="detail-content"></div></dialog>
    <dialog id="confirm"><h2 id="confirm-title">操作を確認</h2><p id="confirm-text"></p><div id="confirm-details"></div><p class="warning">この操作はローカル Docker Engine 上で実行されます。</p><form id="confirm-form"><button id="confirm-cancel" type="button" class="secondary">取り消す</button><button id="confirm-run" type="submit">実行する</button></form></dialog>
    <dialog id="operation-result"><button class="close" aria-label="閉じる">×</button><div id="operation-result-content"></div></dialog>
    <div id="toast" role="status"></div><script src="/app.js"></script>
  </body>
</html>
